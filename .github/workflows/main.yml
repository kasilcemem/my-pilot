name: Guncelleme_Motoru

on:
  workflow_dispatch: # Biz dugmeye basinca calis

jobs:
  calistir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Python Hazirla
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Gerekli Araclari Yukle
        run: pip install requests
      - name: Kodu Calistir
        run: python process.py
      - name: Sonuclari Kaydet
        run: |
          git config --global user.name 'PanelBot'
          git config --global user.email 'bot@github.com'
          git add result.json
          git commit -m "Veriler yenilendi" || exit 0
          git push
