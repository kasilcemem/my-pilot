<script>
    // Sayfa her açıldığında veriyi taze çekmesi için sonuna küçük bir tarih kodu ekliyoruz
    fetch('result.json?v=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            // Hava durumu ve Tarih
            document.getElementById('hava').innerText = data.hava || "Alınamadı";
            document.getElementById('tarih').innerText = data.tarih || "-";
            
            // Palemos Metni
            const metinAlani = document.getElementById('metin-alani');
            const bilgiAlani = document.getElementById('bilgi');
            
            if (data.palemos && data.palemos.hata === "Yok") {
                bilgiAlani.innerText = "Karakter Sayısı: " + data.palemos.uzunluk;
                metinAlani.innerText = data.palemos.ozet;
            } else {
                metinAlani.innerText = "Dosya Durumu: " + (data.palemos ? data.palemos.ozet : "Veri bulunamadı");
            }
        })
        .catch(error => {
            console.error('Hata:', error);
            document.getElementById('metin-alani').innerText = "Veri okuma hatası! Lütfen 1 dakika bekleyip sayfayı yenileyin.";
        });
</script>
