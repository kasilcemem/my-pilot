<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palemos E-Kitap</title>
    <style>
        :root { --bg: #f4ecd8; --card: #fcf5e5; --text: #5b4636; --accent: #8e735b; }
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .navbar { background: var(--card); padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        
        .container { max-width: 800px; margin: 20px auto; background: var(--card); padding: 50px; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.1); flex-grow: 1; position: relative; }
        
        #metin-alani { font-size: 20px; line-height: 1.9; text-align: justify; white-space: pre-wrap; min-height: 60vh; }
        
        .sayfa-navigasyon { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; background: var(--card); border-top: 1px solid rgba(0,0,0,0.05); }
        
        button { padding: 10px 25px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; border-radius: 20px; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--accent); color: white; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .sayfa-numarasi { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="navbar">
    <span>📜 Palemos Kitaplığı</span>
    <button onclick="window.print()">🖨️ PDF Al</button>
</div>

<div class="container">
    <div id="metin-alani">Yükleniyor...</div>
</div>

<div class="sayfa-navigasyon">
    <button id="prevBtn" onclick="sayfaDegistir(-1)">⬅️ Önceki</button>
    <span class="sayfa-numarasi">Sayfa: <span id="aktifSayfa">1</span> / <span id="toplamSayfa">-</span></span>
    <button id="nextBtn" onclick="sayfaDegistir(1)">Sonraki ➡️</button>
</div>

<script>
    let sayfalar = [];
    let aktifIndeks = 0;

    fetch('result.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            // Metni yaklaşık 2000 karakterlik sayfalara böl (veya senin [SAYFA] etiketlerine göre)
            const tamMetin = data.palemos.icerik;
            
            // Eğer metinde [SAYFA] etiketi yoksa, karakter sayısına göre otomatik bölüyoruz
            if (!tamMetin.includes("[SAYFA")) {
                sayfalar = tamMetin.match(/[\s\S]{1,2000}(?=\s|$)/g) || [tamMetin];
            } else {
                sayfalar = tamMetin.split(/\[SAYFA \d+\]/).filter(s => s.trim() !== "");
            }

            document.getElementById('toplamSayfa').innerText = sayfalar.length;
            sayfayiGoster();
        });

    function sayfayiGoster() {
        document.getElementById('metin-alani').innerText = sayfalar[aktifIndeks];
        document.getElementById('aktifSayfa').innerText = aktifIndeks + 1;
        
        // Butonları kontrol et
        document.getElementById('prevBtn').disabled = (aktifIndeks === 0);
        document.getElementById('nextBtn').disabled = (aktifIndeks === sayfalar.length - 1);
        
        // Sayfa başına kaydır
        window.scrollTo(0, 0);
    }

    function sayfaDegistir(yon) {
        aktifIndeks += yon;
        sayfayiGoster();
    }
</script>

</body>
</html>
