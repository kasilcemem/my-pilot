<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Palemos Okuma Paneli</title>
    <style>
        body { font-family: 'Georgia', serif; background: #fdfdfd; color: #222; line-height: 1.8; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 50px; box-shadow: 0 0 20px rgba(0,0,0,0.05); border-radius: 8px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 2.5em; }
        .meta { color: #888; font-size: 0.9em; margin-bottom: 30px; }
        #metin { white-space: pre-wrap; font-size: 1.1em; text-align: justify; }
        .islem-cubugu { position: sticky; top: 0; background: white; padding: 10px 0; border-bottom: 1px solid #eee; margin-bottom: 20px; display: flex; gap: 10px; }
        button { cursor: pointer; padding: 8px 15px; background: #333; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="islem-cubugu">
            <button onclick="window.print()">🖨️ PDF Olarak Kaydet</button>
            <button onclick="alert('Düzenleme modu yakında eklenecek!')">📝 Düzenle</button>
        </div>
        
        <h1 id="baslik">Yükleniyor...</h1>
        <div class="meta">Son Güncelleme: <span id="tarih">-</span> | <span id="karakter">0</span> Karakter</div>
        
        <div id="metin">Lütfen bekleyin, döküman hazırlanıyor...</div>
    </div>

    <script>
        fetch('result.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                document.getElementById('baslik').innerText = data.palemos.baslik;
                document.getElementById('tarih').innerText = data.guncelleme;
                document.getElementById('karakter').innerText = data.palemos.karakter;
                document.getElementById('metin').innerText = data.palemos.icerik;
            })
            .catch(err => {
                document.getElementById('metin').innerText = "Veri yüklenemedi. Lütfen Actions'tan motoru çalıştırın.";
            });
    </script>
</body>
</html>
