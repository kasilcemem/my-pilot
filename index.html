<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dijital Panelim</title>
</head>
<body style="font-family: Arial; text-align: center; background: #eef2f3; padding: 50px;">
    <div style="background: white; display: inline-block; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
        <h1 style="color: #333;">🏠 Panelim</h1>
        <hr>
        <p><strong>📍 Konum:</strong> Kaş / Antalya</p>
        <p><strong>🌡️ Hava:</strong> <span id="hava">Yükleniyor...</span></p>
        <p><strong>📅 Güncelleme:</strong> <span id="tarih">-</span></p>
        <hr>
        <h3>📁 Dosyalarım:</h3>
        <ul id="liste" style="text-align: left; list-style: none; padding: 0;"></ul>
    </div>

    <script>
        // Sayfa acildiginda result.json dosyasini oku
        fetch('result.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('hava').innerText = data.hava;
                document.getElementById('tarih').innerText = data.tarih;
                const listeUl = document.getElementById('liste');
                data.liste.forEach(dosya => {
                    let li = document.createElement('li');
                    li.innerText = "📄 " + dosya;
                    li.style.padding = "5px";
                    listeUl.appendChild(li);
                });
            })
            .catch(err => {
                document.getElementById('hava').innerText = "Veri dosyası henüz oluşmamış.";
            });
    </script>
</body>
</html>
