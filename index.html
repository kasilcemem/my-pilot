<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palemos Arşivi | 1600</title>
    <!-- PDF Oluşturma Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #1a1a1a; --paper: #fcf5e5; --ink: #2c1e14; --accent: #8e735b; }
        body.dark-mode { --paper: #2c2c2c; --ink: #e0d6c5; --bg: #121212; }
        
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--paper); margin: 0; transition: 0.5s; overflow-x: hidden; }

        /* Fihrist Menüsü */
        #fihrist {
            position: fixed; left: -250px; top: 0; width: 250px; height: 100%;
            background: var(--ink); color: var(--paper); transition: 0.3s;
            z-index: 2500; padding: 20px; box-sizing: border-box; overflow-y: auto;
            border-right: 2px solid var(--accent);
        }
        #fihrist.open { left: 0; }
        .fihrist-item { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(142, 115, 91, 0.2); font-size: 0.85em; }
        .fihrist-item:hover { background: var(--accent); color: white; }

        /* Üst Kontrol Paneli */
        .top-controls { position: fixed; top: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 2000; }
        .ctrl-btn { background: var(--accent); color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold; }

        /* Kapak */
        #kapak { text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519791883288-dc8bd696e667?auto=format&fit=crop&q=80&w=1600'); background-size: cover; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 5px solid var(--accent); }
        #kapak h1 { font-size: clamp(3em, 10vw, 5em); margin: 0; letter-spacing: 8px; color: #fcf5e5; }
        .btn-basla { margin-top: 40px; padding: 15px 50px; border: 2px solid #fcf5e5; background: transparent; color: #fcf5e5; cursor: pointer; transition: 0.4s; }

        /* Kitap Alanı */
        #search-panel { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1500; display: none; width: 200px; }
        #search-input { width: 100%; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--accent); background: var(--paper); color: var(--ink); }
        .container { max-width: 800px; margin: 80px auto 120px auto; background: var(--paper); color: var(--ink); padding: 60px; border-radius: 2px; box-shadow: 0 0 50px rgba(0,0,0,0.8); display: none; min-height: 80vh; }
        #metin-alani { font-size: 21px; line-height: 1.8; text-align: justify; white-space: pre-wrap; }
        .highlight { background: #ffeb3b; color: black; }

        /* Navigasyon */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(20, 20, 20, 0.95); padding: 15px; display: none; justify-content: center; gap: 20px; align-items: center; border-top: 3px solid var(--accent); z-index: 1000; }
        .nav-btn { padding: 8px 25px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

<div id="fihrist">
    <h3 style="color:var(--accent)">PALEMOS FİHRİSTİ</h3>
    <div id="fihrist-listesi"></div>
</div>

<div class="top-controls" id="top-ctrl">
    <button class="ctrl-btn" onclick="toggleFihrist()">☰ Menü</button>
    <div id="search-panel" style="display:block; position: static; transform: none;">
        <input type="text" id="search-input" placeholder="Ara..." oninput="ara()">
    </div>
    <div>
        <button class="ctrl-btn" onclick="indirPDF()" style="background: #2e7d32; margin-right: 10px;">📥 PDF</button>
        <button class="ctrl-btn" id="modeBtn" onclick="modDegistir()">🌙</button>
    </div>
</div>

<div id="kapak">
    <h1>PALEMOS ARŞİVİ</h1>
    <p style="color: var(--accent); font-style: italic;">Anno Domini 1600</p>
    <button class="btn-basla" onclick="kitabiAc()">BELGELERİ OKU</button>
</div>

<!-- PDF'e basılacak alan burası -->
<div class="container" id="kitap-sayfasi">
    <div id="pdf-header" style="display:none; text-align:center; font-family:serif;">
        <h1>PALEMOS YAZITLARI</h1>
        <hr>
    </div>
    <div id="metin-alani">Yükleniyor...</div>
</div>

<div class="nav-bar" id="nav">
    <button id="prevBtn" class="nav-btn" onclick="sayfaDegistir(-1)">⬅ Geri</button>
    <div style="color: white">SAYFA <span id="aktifSayfa">1</span> / <span id="toplamSayfa">-</span></div>
    <button id="nextBtn" class="nav-btn" onclick="sayfaDegistir(1)">İleri ➡</button>
</div>

<script>
    let sayfalar = [];
    let aktifIndeks = parseInt(localStorage.getItem('palemos_last_page')) || 0;

    window.onload = () => {
        if(localStorage.getItem('palemos_dark_mode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('modeBtn').innerText = '☀️';
        }
    };

    function kitabiAc() {
        document.getElementById('kapak').style.display = 'none';
        document.getElementById('kitap-sayfasi').style.display = 'block';
        document.getElementById('nav').style.display = 'flex';
        document.getElementById('top-ctrl').style.display = 'flex';
        sayfayiGoster();
    }

    function toggleFihrist() { document.getElementById('fihrist').classList.toggle('open'); }

    function modDegistir() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('palemos_dark_mode', isDark);
        document.getElementById('modeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    fetch('result.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            sayfalar = data.palemos.sayfalar;
            document.getElementById('toplamSayfa').innerText = sayfalar.length;
            const liste = document.getElementById('fihrist-listesi');
            sayfalar.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'fihrist-item';
                item.innerText = (i + 1) + ". " + s.substring(0, 25) + "...";
                item.onclick = () => { aktifIndeks = i; sayfayiGoster(); toggleFihrist(); };
                liste.appendChild(item);
            });
            if(document.getElementById('kitap-sayfasi').style.display === 'block') sayfayiGoster();
        });

    function sayfayiGoster() {
        if (sayfalar.length > 0) {
            document.getElementById('metin-alani').innerText = sayfalar[aktifIndeks];
            document.getElementById('aktifSayfa').innerText = aktifIndeks + 1;
            document.getElementById('prevBtn').disabled = (aktifIndeks === 0);
            document.getElementById('nextBtn').disabled = (aktifIndeks === sayfalar.length - 1);
            localStorage.setItem('palemos_last_page', aktifIndeks);
            window.scrollTo(0, 0);
        }
    }

    function indirPDF() {
        const element = document.getElementById('kitap-sayfasi');
        const opt = {
            margin: 1,
            filename: 'Palemos_Arsivi_1600.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        // İndirirken gece modundaysa geçici olarak düzelt (beyaz kağıt olsun)
        const isDark = document.body.classList.contains('dark-mode');
        if(isDark) document.body.classList.remove('dark-mode');
        
        html2pdf().set(opt).from(element).save().then(() => {
            if(isDark) document.body.classList.add('dark-mode');
        });
    }

    function ara() {
        const k = document.getElementById('search-input').value.toLowerCase();
        if (k.length < 3) { sayfayiGoster(); return; }
        for (let i = 0; i < sayfalar.length; i++) {
            if (sayfalar[i].toLowerCase().includes(k)) {
                aktifIndeks = i; sayfayiGoster();
                const icerik = document.getElementById('metin-alani').innerHTML;
                document.getElementById('metin-alani').innerHTML = icerik.replace(new RegExp(`(${k})`, 'gi'), '<span class="highlight">$1</span>');
                break; 
            }
        }
    }

    function sayfaDegistir(yon) { aktifIndeks += yon; sayfayiGoster(); }
</script>

</body>
</html>
