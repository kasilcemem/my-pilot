<!-- HTML içindeki script kısmını şu şekilde güncelle -->
<script>
    fetch('result.json')
        .then(response => response.json())
        .then(data => {
            const panel = document.getElementById('liste');
            
            // Palemos Özeti Kısmı
            let div = document.createElement('div');
            div.innerHTML = `
                <h3>📖 Palemos Döküman Özeti</h3>
                <p><i>Toplam Karakter: ${data.palemos_detay.uzunluk}</i></p>
                <div style="background:#eee; padding:15px; text-align:left; border-left:5px solid #333;">
                    ${data.palemos_detay.ozet}
                </div>
                <button onclick="alert('Tam metin editör moduna yakında geçilecek!')">Düzenlemeye Başla</button>
            `;
            panel.appendChild(div);
        });
</script>
