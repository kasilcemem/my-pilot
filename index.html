<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palemos Arşivi | 1600</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #1a1a1a; --paper: #fcf5e5; --ink: #2c1e14; --accent: #8e735b; }
        body.dark-mode { --paper: #2c2c2c; --ink: #e0d6c5; --bg: #121212; }
        
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--paper); margin: 0; transition: 0.5s; overflow-x: hidden; }

        /* Üst Kontrol Paneli */
        .top-controls { position: fixed; top: 0; width: 100%; display: none; justify-content: space-between; padding: 10px 20px; box-sizing: border-box; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); border-bottom: 1px solid var(--accent); }
        .ctrl-btn { background: var(--accent); color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }

        /* Fihrist */
        #fihrist { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--ink); color: var(--paper); transition: 0.3s; z-index: 2500; padding: 20px; overflow-y: auto; border-right: 2px solid var(--accent); }
        #fihrist.open { left: 0; }
        .fihrist-item { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(142, 115, 91, 0.2); font-size: 0.85em; }

        /* Kapak */
        #kapak { text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519791883288-dc8bd696e667?auto=format&fit=crop&q=80&w=1600'); background-size: cover; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn-basla { margin-top: 40px; padding: 15px 50px; border: 2px solid #fcf5e5; background: transparent; color: #fcf5e5; cursor: pointer; font-size: 1.1em; }

        /* Kitap Alanı */
        .container { max-width: 800px; margin: 80px auto 120px auto; background: var(--paper); color: var(--ink); padding: 50px; border-radius: 2px; box-shadow: 0 0 50px rgba(0,0,0,0.8); display: none; }
        #metin-alani { font-size: 21px; line-height: 1.8; text-align: justify; white-space: pre-wrap; }

        /* Not Alma Alanı */
        #note-section { margin-top: 40px; border-top: 2px dashed var(--accent); padding-top: 20px; }
        #note-area { width: 100%; height: 100px; background: rgba(0,0,0,0.05); border: 1px solid var(--accent); padding: 10px; font-family: sans-serif; resize: none; color: var(--ink); }
        
        /* Navigasyon */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(20, 20, 20, 0.95); padding: 15px; display: none; justify-content: center; gap: 20px; align-items: center; border-top: 3px solid var(--accent); z-index: 1000; }
        .nav-btn { padding: 8px 25px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

<div id="fihrist">
    <h3 style="color:var(--accent)">FİHRİST</h3>
    <div id="fihrist-listesi"></div>
</div>

<div class="top-controls" id="top-ctrl">
    <button class="ctrl-btn" onclick="toggleFihrist()">☰ Menü</button>
    <div id="audio-controls">
        <button class="ctrl-btn" onclick="sesliOku()" id="speakBtn">🔊 Oku</button>
        <button class="ctrl-btn" onclick="sesiDurdur()" id="stopBtn">⏹ Durdur</button>
    </div>
    <div>
        <button class="ctrl-btn" onclick="indirPDF()" style="background: #2e7d32;">📥 PDF</button>
        <button class="ctrl-btn" id="modeBtn" onclick="modDegistir()">🌙</button>
    </div>
</div>

<div id="kapak">
    <h1>PALEMOS ARŞİVİ</h1>
    <p style="color: var(--accent); font-style: italic;">Anno Domini 1600</p>
    <button class="btn-basla" onclick="kitabiAc()">BELGELERİ OKU</button>
</div>

<div class="container" id="kitap-sayfasi">
    <div id="metin-alani">Yükleniyor...</div>
    
    <div id="note-section">
        <h4 style="margin:0 0 10px 0; color:var(--accent)">✍️ Bu Sayfaya Not Bırak:</h4>
        <textarea id="note-area" placeholder="Notlarınızı buraya yazın, otomatik kaydedilir..."></textarea>
    </div>
</div>

<div class="nav-bar" id="nav">
    <button id="prevBtn" class="nav-btn" onclick="sayfaDegistir(-1)">⬅ Geri</button>
    <div style="color: white">SAYFA <span id="aktifSayfa">1</span> / <span id="toplamSayfa">-</span></div>
    <button id="nextBtn" class="nav-btn" onclick="sayfaDegistir(1)">İleri ➡</button>
</div>

<script>
    let sayfalar = [];
    let aktifIndeks = parseInt(localStorage.getItem('palemos_last_page')) || 0;
    const synth = window.speechSynthesis;

    function kitabiAc() {
        document.getElementById('kapak').style.display = 'none';
        document.getElementById('kitap-sayfasi').style.display = 'block';
        document.getElementById('nav').style.display = 'flex';
        document.getElementById('top-ctrl').style.display = 'flex';
        sayfayiGoster();
    }

    function toggleFihrist() { document.getElementById('fihrist').classList.toggle('open'); }

    function modDegistir() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('palemos_dark_mode', isDark);
        document.getElementById('modeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    fetch('result.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            sayfalar = data.palemos.sayfalar;
            document.getElementById('toplamSayfa').innerText = sayfalar.length;
            const liste = document.getElementById('fihrist-listesi');
            sayfalar.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'fihrist-item';
                item.innerText = (i + 1) + ". " + s.substring(0, 25) + "...";
                item.onclick = () => { aktifIndeks = i; sayfayiGoster(); toggleFihrist(); };
                liste.appendChild(item);
            });
            if(document.getElementById('kitap-sayfasi').style.display === 'block') sayfayiGoster();
        });

    function sayfayiGoster() {
        if (sayfalar.length > 0) {
            sesiDurdur();
            const metin = sayfalar[aktifIndeks];
            document.getElementById('metin-alani').innerText = metin;
            document.getElementById('aktifSayfa').innerText = aktifIndeks + 1;
            document.getElementById('prevBtn').disabled = (aktifIndeks === 0);
            document.getElementById('nextBtn').disabled = (aktifIndeks === sayfalar.length - 1);
            
            // Notları yükle
            const savedNote = localStorage.getItem('note_page_' + aktifIndeks) || "";
            document.getElementById('note-area').value = savedNote;

            localStorage.setItem('palemos_last_page', aktifIndeks);
            window.scrollTo(0, 0);
        }
    }

    // Not Kaydetme (Yazıldıkça kaydeder)
    document.getElementById('note-area').oninput = (e) => {
        localStorage.setItem('note_page_' + aktifIndeks, e.target.value);
    };

    // SESLİ OKUMA FONKSİYONLARI
    function sesliOku() {
        sesiDurdur();
        const metin = sayfalar[aktifIndeks];
        const utter = new SpeechSynthesisUtterance(metin);
        utter.lang = 'tr-TR';
        utter.rate = 0.9; // Biraz yavaş ve vakur bir okuma
        synth.speak(utter);
    }

    function sesiDurdur() {
        synth.cancel();
    }

    function sayfaDegistir(yon) { aktifIndeks += yon; sayfayiGoster(); }

    function indirPDF() {
        const element = document.getElementById('kitap-sayfasi');
        html2pdf().from(element).save('Palemos_Notlu_Arsiv.pdf');
    }
</script>

</body>
</html>
