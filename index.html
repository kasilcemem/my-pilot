<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palemos Dijital Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; text-align: center; }
        .stat-box { display: flex; justify-content: space-around; background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-item label { display: block; font-size: 0.8em; color: #7f8c8d; text-transform: uppercase; }
        .stat-item span { font-weight: bold; font-size: 1.1em; color: #2980b9; }
        .content-area { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .text-preview { background: #fdfdfd; padding: 15px; border-left: 4px solid #2980b9; line-height: 1.6; white-space: pre-wrap; color: #444; max-height: 500px; overflow-y: auto; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.8em; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Palemos Kontrol Paneli</h1>

    <div class="stat-box">
        <div class="stat-item">
            <label>📍 Konum</label>
            <span>Kaş / Antalya</span>
        </div>
        <div class="stat-item">
            <label>🌡️ Hava Durumu</label>
            <span id="hava">Yükleniyor...</span>
        </div>
        <div class="stat-item">
            <label>📅 Son Güncelleme</label>
            <span id="tarih">-</span>
        </div>
    </div>

    <div class="content-area">
        <h3>📖 Palemos Metin Dosyası</h3>
        <p id="bilgi" style="font-size: 0.9em; color: #666;"></p>
        <div id="metin-alani" class="text-preview">Metin yükleniyor, lütfen bekleyin...</div>
    </div>

    <div class="footer">
        GitHub Actions tarafından otomatik olarak güncellenmektedir.
    </div>
</div>

<script>
    // result.json dosyasından verileri çekiyoruz
    fetch('result.json')
        .then(response => {
            if (!response.ok) throw new Error('Veri dosyası henüz oluşmamış.');
            return response.json();
        })
        .then(data => {
            // Hava durumu ve tarihi yazdır
            document.getElementById('hava').innerText = data.hava || "Bilinmiyor";
            document.getElementById('tarih').innerText = data.tarih || "-";
            
            // Palemos metin bilgilerini yazdır
            if (data.palemos) {
                document.getElementById('bilgi').innerText = "Karakter Sayısı: " + data.palemos.uzunluk;
                document.getElementById('metin-alani').innerText = data.palemos.ozet;
            }
        })
        .catch(error => {
            console.error('Hata:', error);
            document.getElementById('metin-alani').innerText = "Hata: result.json bulunamadı. Lütfen Actions sekmesinden 'Run Workflow' yapın.";
        });
</script>

</body>
</html>
